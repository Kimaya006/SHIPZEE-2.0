<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f4c3a" />
  <title>Home | Shipzee</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- hidden until guard.js confirms this user is a driver; shell.js adds the top bar and tabs -->
  <div id="app" hidden>
    <main class="page" id="content">
      <h1 class="page-title" id="greeting">Hi</h1>
      <p class="page-sub">Here is where your trips stand.</p>

      <div class="stats">
        <div class="stat">
          <p class="stat-value" id="stat-open">-</p>
          <p class="stat-label">Open trips</p>
        </div>
        <div class="stat">
          <p class="stat-value" id="stat-kg">-</p>
          <p class="stat-label">Kg free</p>
        </div>
        <div class="stat">
          <p class="stat-value" id="stat-total">-</p>
          <p class="stat-label">Trips posted</p>
        </div>
      </div>

      <h2 class="section-title">Your next trip</h2>
      <ul class="trip-list" id="next-trip"></ul>
      <div class="empty" id="next-empty" hidden></div>
    </main>
  </div>

  <script type="module" src="js/driver-home.js"></script>
</body>
</html>
