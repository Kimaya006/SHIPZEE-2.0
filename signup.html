<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f4c3a" />
  <title>Create account | Shipzee</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <a class="brand brand-dark auth-brand" href="index.html">
      <img src="assets/logo.svg" alt="" width="32" height="32" />
      <span>Shipzee</span>
    </a>

    <h1 class="auth-title">Create your account</h1>

    <form id="signup-form" novalidate>
      <h2 class="form-heading form-heading-first">About you</h2>

      <label for="name">Full name</label>
      <input type="text" id="name" autocomplete="name" />

      <label for="role">I want to</label>
      <select id="role">
        <option value="">Choose one</option>
        <option value="sender">Send parcels (sender)</option>
        <option value="driver">Carry parcels on my trips (driver)</option>
      </select>
      <p class="hint">You cannot change this later.</p>

      <h2 class="form-heading">Contact details</h2>

      <div class="field-grid">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" />
        </div>
        <div>
          <label for="email2">Second email</label>
          <input type="email" id="email2" />
        </div>
        <div>
          <label for="phone1">Phone number</label>
          <input type="tel" id="phone1" placeholder="10 digits" maxlength="10" inputmode="numeric" />
        </div>
        <div>
          <label for="phone2">Second phone number</label>
          <input type="tel" id="phone2" placeholder="10 digits" maxlength="10" inputmode="numeric" />
        </div>
      </div>
      <p class="hint">The second email and phone are backups in case we cannot reach the first.</p>

      <h2 class="form-heading">Password</h2>

      <label for="password">Password (at least 8 characters)</label>
      <input type="password" id="password" autocomplete="new-password" />

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" autocomplete="new-password" />

      <p id="message" class="message" role="alert"></p>
      <button type="submit" class="btn btn-block">Create account</button>
    </form>

    <p class="footer-text">Already have an account? <a href="login.html">Log in</a></p>
  </main>

  <script type="module" src="js/signup.js"></script>
</body>
</html>
