<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up | RoadParcel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="card">
    <h1>Create account</h1>

    <form id="signup-form" novalidate>
      <label for="name">Full name</label>
      <input type="text" id="name" autocomplete="name" />

      <label for="role">I want to</label>
      <select id="role">
        <option value="">Choose one</option>
        <option value="sender">Send a parcel (Sender)</option>
        <option value="driver">Carry parcels on my trip (Driver)</option>
      </select>

      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" />

      <label for="email2">Second email</label>
      <input type="email" id="email2" />

      <label for="phone1">Phone number</label>
      <input type="tel" id="phone1" placeholder="10 digit number" maxlength="10" />

      <label for="phone2">Second phone number</label>
      <input type="tel" id="phone2" placeholder="10 digit number" maxlength="10" />

      <label for="password">Password (min 8 characters)</label>
      <input type="password" id="password" autocomplete="new-password" />

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" autocomplete="new-password" />

      <p id="message" class="message" role="alert"></p>
      <button type="submit" class="btn">Sign up</button>
    </form>

    <p class="footer-text">Already have an account? <a href="login.html">Log in</a></p>
  </main>

  <script type="module" src="js/signup.js"></script>
</body>
</html>
