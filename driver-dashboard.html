<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver dashboard | RoadParcel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="top-aligned">
  <!-- hidden until guard.js confirms this user is a driver -->
  <main class="card" id="content" hidden>
    <h1 id="welcome">Welcome</h1>
    <p class="subtitle">Driver dashboard</p>

    <h2>Post a trip</h2>
    <form id="trip-form" novalidate>
      <label for="from">From (city)</label>
      <input type="text" id="from" list="cities" autocomplete="off" />

      <label for="to">To (city)</label>
      <input type="text" id="to" list="cities" autocomplete="off" />

      <label for="departAt">Leaving on</label>
      <input type="datetime-local" id="departAt" />

      <label for="capacityKg">Space for parcels (kg, max 50)</label>
      <input type="number" id="capacityKg" min="1" max="50" step="1" inputmode="numeric" />

      <label for="ratePerKg">Your rate (rupees per kg)</label>
      <input type="number" id="ratePerKg" min="1" max="1000" step="1" inputmode="numeric" />

      <datalist id="cities"></datalist>

      <p id="trip-message" class="message" role="alert"></p>
      <button type="submit" class="btn">Post trip</button>
    </form>

    <h2>My trips</h2>
    <p id="trips-empty" class="subtitle" hidden>You have not posted any trips yet.</p>
    <ul id="trip-list" class="trip-list"></ul>

    <button id="logout-btn" class="btn btn-outline">Log out</button>
  </main>

  <script type="module" src="js/driver-dashboard.js"></script>
</body>
</html>
