<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sender dashboard | RoadParcel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="top-aligned">
  <!-- hidden until guard.js confirms this user is a sender -->
  <main class="card" id="content" hidden>
    <h1 id="welcome">Welcome</h1>
    <p class="subtitle">Sender dashboard</p>

    <h2>Find a driver</h2>
    <form id="search-form" novalidate>
      <label for="from">From (city)</label>
      <input type="text" id="from" list="cities" autocomplete="off" />

      <label for="to">To (city)</label>
      <input type="text" id="to" list="cities" autocomplete="off" />

      <label for="date">Date (optional)</label>
      <input type="date" id="date" />

      <datalist id="cities"></datalist>

      <p id="search-message" class="message" role="alert"></p>
      <button type="submit" class="btn">Search drivers</button>
    </form>

    <h2 id="results-heading" hidden>Available trips</h2>
    <p id="results-empty" class="subtitle" hidden>No drivers found for this route yet.</p>
    <ul id="results-list" class="trip-list"></ul>

    <button id="logout-btn" class="btn btn-outline">Log out</button>
  </main>

  <script type="module" src="js/sender-dashboard.js"></script>
</body>
</html>
